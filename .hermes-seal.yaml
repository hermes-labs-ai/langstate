seal_version: 1
repo: hermes-labs-ai/langstate
granted: PLACEHOLDER
expires: PLACEHOLDER
categories:
  continuity:
    health_endpoint: ''
    graceful_degradation:
    - dependency: ollama
      on_failure: raise_adapter_unavailable
      verified_by: tests/test_adapters.py::test_probe_of_unavailable_returns_structured_failure
      env: {}
      python_bin: null
      command: null
  reliability:
    test_command: python -m pytest -q tests/
    coverage_min: 0.0
    no_silent_failures: true
    scan_paths:
    - src/langstate
    silent_failure_check: null
  compliance:
    license: Apache-2.0
    sbom: PENDING
    lintlang_clean: false
    eu_ai_act: passes
  mom_ready:
    install: pip install langstate
    quickstart: README.md#install
    errors_human: true
signing:
  algorithm: ed25519
  pubkey: PLACEHOLDER
  signature: PLACEHOLDER
  issuer: null
revocation:
  list: https://hermes-labs.ai/seal/revoked.json
